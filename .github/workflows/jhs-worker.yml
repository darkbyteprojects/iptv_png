name: JHS Live Scraper

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Setup Jio API Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install API Core Dependencies
        run: |
          pip install playwright requests

      - name: Cache API Engine Data
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: api-engine-${{ runner.os }}

      - name: Initialize Core Renderer
        run: playwright install --with-deps chromium

      - name: Fetch Integration Logic
        env:
          PAT: ${{ secrets.REPO_SECRET }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ secrets.REPO_NAME }}
          FILE: ${{ secrets.MY_JIO_API }} 
        run: |
          curl -s -f \
            -H "Authorization: Bearer ${PAT}" \
            -H "Accept: application/vnd.github.v3.raw" \
            -L "https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}" \
            -o runner.py

      - name: Execute Stream Extractor
        run: python runner.py

      - name: Cleanup Temporary Files
        if: always()
        run: rm -f runner.py

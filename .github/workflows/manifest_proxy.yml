name: Generate Proxied Manifests

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build-manifests:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Manifest Rewriter
        run: |
          python update_manifest_proxy.py

      - name: Commit and push updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add BOTH generated files (or use 'git add .' to add everything changed)
          git add proxied_manifest_playlist.json playlist.m3u
          
          # Simplified commit logic: it commits if there are changes, or just echoes if nothing changed
          git commit -m "Auto-update proxied playlists [skip ci]" || echo "No changes to commit"
          
          # Push the changes
          git push origin main

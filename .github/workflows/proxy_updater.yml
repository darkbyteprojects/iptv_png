name: Wrap Streams in Proxy

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to click "Run workflow" manually

jobs:
  update-proxy-links:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Proxy Wrapper Script
        run: |
          python sonytv.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sonytv.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-wrap streams with PHP proxy [skip ci]" && git push)

name: JioTV Builder

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the M3U to the public repo

    # Your custom environment block
    env:
      PAT: ${{ secrets.REPO_SECRET }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ secrets.REPO_NAME }}
      FILE: ${{ secrets.SCRIPT_5 }}

    steps:
      # 1. Checkout the public repo (where the output will be saved)
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      # 2. Checkout the private repo into a temporary subfolder
      # This uses your env variables to target the right repo and authenticate
      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OWNER }}/${{ env.REPO }}
          token: ${{ env.PAT }}
          path: private_code

      # 3. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Install dependencies
      - name: Install Dependencies
        run: pip install requests

      # 5. Run the script from the private folder
      # The output file (my_master_playlist.m3u) will be written to the root directory
      - name: Run Aggregator Script
        run: |
          python "private_code/$FILE"

      # 6. Remove the private code before committing to ensure it stays secret
      - name: Cleanup Private Files
        run: rm -rf private_code

      # 7. Commit and push the generated playlist
      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add my_master_playlist.m3u
          git diff --staged --quiet || (git commit -m "Auto-update playlist [skip ci]" && git push)
